<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>太阳系漫游 · Solar System</title>
<style>
  :root {
    --panel: rgba(10, 16, 34, .78);
    --line: rgba(130, 160, 255, .22);
    --accent: #7fb2ff;
    --text: #e8edf8;
    --muted: #93a0c4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #04050f;
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }

  /* ---------- 顶栏 ---------- */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: linear-gradient(rgba(4,5,15,.85), rgba(4,5,15,0));
    z-index: 10;
  }
  #topbar .links { display: flex; gap: 8px; }
  #topbar a {
    color: var(--muted); text-decoration: none; font-size: 13px;
    padding: 6px 10px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  #topbar a:hover { color: var(--text); }
  #topbar h1 {
    margin: 0 auto; font-size: 17px; font-weight: 800; letter-spacing: .5px;
    text-shadow: 0 0 14px rgba(127,178,255,.5);
  }
  #topbar h1 small { color: var(--muted); font-weight: 600; font-size: 12px; margin-left: 8px; }
  #topbar .tools { display: flex; gap: 6px; }

  /* ---------- 通用按钮 ---------- */
  .btn {
    font: inherit; font-size: 13px; font-weight: 700;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 7px 12px; cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: rgba(50, 70, 130, .5); }
  .btn.on { background: rgba(90, 130, 255, .38); border-color: var(--accent); }

  /* ---------- 星球胶囊行 ---------- */
  #chips {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 14px; z-index: 10;
    display: flex; gap: 8px; max-width: min(96vw, 860px);
    overflow-x: auto; padding: 4px;
    scrollbar-width: none;
  }
  #chips::-webkit-scrollbar { display: none; }
  .chip {
    display: flex; align-items: center; gap: 7px;
    white-space: nowrap;
    font: inherit; font-size: 13px; font-weight: 700; color: var(--text);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .chip i { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset -2px -3px 4px rgba(0,0,0,.45); }
  .chip small { color: var(--muted); font-weight: 600; }
  .chip.on { background: rgba(90, 130, 255, .4); border-color: var(--accent); }

  /* ---------- 视角 / 速度行 ---------- */
  #views {
    position: fixed; left: 14px; top: 58px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
  }
  #speedbar {
    position: fixed; right: 14px; bottom: 64px; z-index: 10;
    display: flex; gap: 6px;
  }
  #speedbar .btn { min-width: 44px; }

  /* ---------- 信息卡 ---------- */
  #info {
    position: fixed; right: 14px; top: 58px; z-index: 9;
    width: 300px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 16px;
    backdrop-filter: blur(10px);
    line-height: 1.7;
  }
  #info h2 { margin: 0 0 2px; font-size: 20px; }
  #info h2 small { color: var(--muted); font-size: 13px; margin-left: 8px; font-weight: 600; }
  #info .zh { margin: 6px 0 0; font-size: 13.5px; }
  #info .en { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); font-style: italic; }
  #info .row { display: flex; justify-content: space-between; font-size: 12.5px; border-bottom: 1px dashed var(--line); padding: 3px 0; }
  #info .row span:first-child { color: var(--muted); }
  #info .fun { margin-top: 8px; font-size: 12.5px; color: #ffd98a; }
  #info .fun.en { color: #b9c8f0; }

  /* ---------- 提示 & 降级 ---------- */
  #hint {
    position: fixed; left: 14px; bottom: 64px; z-index: 9;
    font-size: 12px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px 10px; backdrop-filter: blur(6px);
  }
  #fallback {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    color: var(--muted); font-size: 15px; line-height: 2;
  }

  @media (max-width: 760px) {
    #info {
      left: 10px; right: 10px; top: auto; bottom: 118px; width: auto;
      max-height: 34vh; overflow-y: auto; line-height: 1.55;
    }
    #views { top: auto; bottom: 118px; left: auto; right: 10px; flex-direction: row; flex-wrap: wrap; justify-content: flex-end; max-width: 46vw; }
    #hint { display: none; }
    #speedbar { bottom: 64px; }
    #topbar h1 { font-size: 15px; }
  }
</style>
<script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js?id=3RQRMtIBrS5DhXbk&ck=3RQRMtIBrS5DhXbk&autoTrack=true"></script>
</head>
<body>
<div id="stage"></div>

<div id="topbar">
  <div class="links">
    <a href="/">← 博客</a>
    <a href="/games/children-games/reagan/arcade/">🎮 游戏</a>
  </div>
  <h1>太阳系漫游<small>Solar System Tour</small></h1>
  <div class="tools">
    <button class="btn on" id="btnLabels" title="显示 / 隐藏星球名">🏷</button>
  </div>
</div>

<div id="views">
  <button class="btn on" data-view="overview">🌐 全景</button>
  <button class="btn" data-view="top">🗺 俯瞰</button>
  <button class="btn" data-view="edge">📐 侧视</button>
  <button class="btn" data-view="earth">🌍 跟随地球</button>
</div>

<div id="speedbar">
  <button class="btn" data-speed="0">⏸</button>
  <button class="btn on" data-speed="1">1×</button>
  <button class="btn" data-speed="5">5×</button>
  <button class="btn" data-speed="20">20×</button>
</div>

<div id="hint">拖拽旋转 · 滚轮 / 双指缩放 · 点星球看介绍</div>
<div id="chips"></div>
<div id="info"></div>
<div id="fallback">这个页面需要 WebGL 支持。<br>请换用较新的 Chrome / Safari / Edge 浏览器打开。</div>

<script type="module" src="main.js"></script>
</body>
</html>
